[project]
name = "triager-evals"
version = "0.1.0"
description = "Datasets and evals for the issue triage strategies"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "logfire[httpx]>=4",
  "pydantic>=2.10",
  "pydantic-evals>=1",
  "pyyaml>=6",
  "jsonschema>=4",
  "pydantic-ai-slim[openai,anthropic,google]>=1",
]

[project.scripts]
fetch-issues = "triager_evals.fetch:main"
normalize-issues = "triager_evals.normalize:main"
build-dataset = "triager_evals.build_dataset:main"
triage-eval = "triager_evals.run:main"
compare-runs = "triager_evals.compare:main"
run-experiments = "triager_evals.experiments:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
# google-genai on Python 3.14; harmless until 3.17
filterwarnings = ["ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triager_evals"]
