- name: kubernetes-110992
  inputs:
    issue:
      number: 110992
      title: GenerateSelfSignedCertKeyWithFixtures private keys permissions
      body: "Hello, the SRC folks asked that I file this publicly:\n\nIn the client-go repo, util/cert/cert.go , function\n\
        `GenerateSelfSignedCertKeyWithFixtures()` creates a private key and stores\nit into a file with mode `0644`:\n\nhttps://github.com/kubernetes/client-go/blob/acab036eff5706db06b4eb79253165cf4be0d9c5/util/cert/cert.go#L184\n\
        \n```\n        // Generate key\n        keyBuffer := bytes.Buffer{}\n        if err := pem.Encode(&keyBuffer, &pem.Block{Type:\
        \ keyutil.RSAPrivateKeyBlockType, Bytes: x509.MarshalPKCS1PrivateKey(priv)}); err != nil {\n                return\
        \ nil, nil, err\n        }\n         \n        if len(fixtureDirectory) > 0 {\n                if err := ioutil.WriteFile(certFixturePath,\
        \ certBuffer.Bytes(), 0644); err != nil {\n                        return nil, nil, fmt.Errorf(\"failed to write cert\
        \ fixture to %s: %v\", certFixturePath, err)\n                }\n                if err := ioutil.WriteFile(keyFixturePath,\
        \ keyBuffer.Bytes(), 0644); err != nil {\n                        return nil, nil, fmt.Errorf(\"failed to write key\
        \ fixture to %s: %v\", certFixturePath, err)\n                }\n        }\n```\n\nTypically keys are created with\
        \ more restrictive modes to prevent other\nusers or services on the system from being able to copy them before the\n\
        user fixes the permissions.\n\nOf course, if a more restrictive umask is in place, this may not be a big\ndeal, but\
        \ it's an extremely fickle piece of the environment to rely upon\nfor security. It's better to be explicit.\n\nThanks"
      author_association: NONE
      created_at: '2022-07-06T23:29:30Z'
