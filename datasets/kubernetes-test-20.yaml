      \ example, if user A is given the get list permission for pod A and pod B, after user A logs in to the platform, how\
      \ can the pods owned by user A be displayed by default? pod A and pod B in the resource object\n\nI completely understand\
      \ your idea.\n\nbut, It seems that k8s can't fit your requirements. \n\nsome workarounds are needed:\n1. use multiple\
      \ get operation to access all pods (save the pods list that User A can access in your management DB)\n2. use a super\
      \ k8s user who is able to access all pods, labels the pods with auth-status/user-a: \"true\" to list with labelSelector\
      \ (all auth depends on your management system)\n3. separate different user's pods with different namespace, then use\
      \ roleBinding\n\n--- \n\nI would like to consider that a auth with resourceName is used for the temporary access for\
      \ specific developer and specific objects.\nsay, thousands of workload deployed in a cluster, some of them are so important,\
      \ only could be access by operators in usual, but sometime developers need to access the workload in his/her duty, resourceName\
      \ auth could helps restrict the range.\n"
