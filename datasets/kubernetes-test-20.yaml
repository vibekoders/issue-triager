    - 'I tried to fix one similar issue in https://github.com/kubernetes/kubernetes/pull/103967. '
    - /sig node
    - /triage accepted
    - "can I work on this issue? @ehashman @pacoxu  Thanks very much. \n/assign"
    - |-
      We've experienced this issue with clusters on v1.20. The [release notes](https://github.com/kubernetes/kubernetes/blob/master/CHANGELOG/CHANGELOG-1.20.md#no-really-you-must-read-this-before-you-upgrade) for that version mention the following change:
      > A bug was fixed in kubelet where exec probe timeouts were not respected

      Since v1.20 is seemingly when exec probe timeouts started being enforced, would it be possible to have this fix for this issue backported to all minor versions since then?

      Thanks!
    close_outcome: fixed
