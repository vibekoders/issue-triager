- name: kubernetes-131082
  inputs:
    issue:
      number: 131082
      title: Custom Resource Definition format is not validated
      body: "### What happened?\n\nI noticed that the kube-api server doesn't validate the `format` field despite the documentation\
        \ mentioning that only the following field types are valid: \n\n- int32\n- int64\n- float\n- double\n- byte\n- date\n\
        - date-time\n- password\n\nhttps://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/#format\n\
        \nTrying to apply a CRD with field `format: giubseufbuilsebfiu` results in a successfull apply.\n\n### What did you\
        \ expect to happen?\n\nI would expect that the kube api server returns an error that the `format: giubseufbuilsebfiu`\
        \ is not an valid format.\n\n### How can we reproduce it (as minimally and precisely as possible)?\n\n```yaml\napiVersion:\
        \ apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata:\n  name: debugformats.example.com\nspec:\n  group:\
        \ example.com\n  versions:\n  - name: v1\n    served: true\n    storage: true\n    schema:\n      openAPIV3Schema:\n\
        \        type: object\n        properties:\n          spec:\n            type: object\n            properties:\n \
        \             format:\n                format: giubseufbuilsebfiu\n                type: string\n  scope: Namespaced\n\
        \  names:\n    plural: debugformats\n    singular: debugformat\n    kind: DebugFormat\n    shortNames:\n    - df\n\
        ```\n\nApply this file will result in: `customresourcedefinition.apiextensions.k8s.io/debugformats.example.com configured`\n\
        \n### Anything else we need to know?\n\nI encountered a validation error with [kubeconform](https://github.com/yannh/kubeconform)\
        \ when processing a duration field within the Grafana Operator's GrafanaDatasource Custom Resource Definition (CRD).\
        \ The problem stems from the field's format: duration specification in the operator's manifests: https://github.com/grafana/grafana-operator/blob/8a35e3b02a161c8c8196eb15c0245a0932a2357f/bundle/manifests/grafana.integreatly.org_grafanadatasources.yaml#L159\n\
        \nThis highlights a potential weakness: if the Kubernetes API server strictly enforced expected field types, this\
        \ issue would not arise.\n\n### Kubernetes version\n\n<details>\n\n```console\n$ kubectl version\nClient Version:\
        \ v1.32.3\nKustomize Version: v5.5.0\nServer Version: v1.32.2-eks-bc803b4\n```\n\n</details>\n\n### Cloud provider\n\
        \n<details>\nAWS EKS 1.32\n</details>\n\n### OS version\n\n### Install tools\n\n### Container runtime (CRI) and version\
        \ (if applicable)\n\n### Related plugins (CNI, CSI, ...) and versions (if applicable)"
      author_association: NONE
