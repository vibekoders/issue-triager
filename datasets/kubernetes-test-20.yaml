- name: kubernetes-106111
  inputs:
    issue:
      number: 106111
      title: Liveness/Readiness probe timed out but no reason found in pod describe events
      body: "### What happened?\n\nI was trying a scenario where liveness/readiness probe command run inside the container\
        \ for long time('sleep 10 && exit 10') with shorter timeoutSecod value say 2 Sec. As expected container restarted\
        \ because of timeout but when i check the events in pod describe it stated only unhealthy and in events actual reason\
        \ for probe failure is not printed **\"liveness probe failed:<'no reason printed'> \"**. Without clear logs or pod\
        \ events description it is very difficult to debug and understand what is the failure.\n\nBelow is the example manifest\
        \ file to reproduce the issue. \n===================\napiVersion: v1\nkind: Pod\nmetadata:\n  labels:\n    test: liveness\n\
        \  name: liveness-exec\nspec:\n  containers:\n  - name: liveness\n    image: k8s.gcr.io/busybox\n    args:\n    -\
        \ /bin/sh\n    - -c\n    - touch /tmp/healthy; sleep 30; rm -rf /tmp/healthy; sleep 600\n       readinessProbe:\n\
        \      exec:\n        command:  [/bin/sh, -c , 'sleep 10 && exit10']\n      initialDelaySeconds: 5\n      periodSeconds:\
        \ 5\n      timeoutSeconds: 2\n    livenessProbe:\n      exec:\n        command:  [/bin/sh, -c ,'sleep 5 && exit10']\n\
        \      initialDelaySeconds: 5\n      periodSeconds: 5\n      timeoutSeconds: 2 \n=====================\nIt would be\
        \ better if actual reason or something for probe failure printed in pod describe events incase of liveness/readiness\
        \ probe gets timeout.\n \nExample like below in pod describe events:\n-----------------------------------\nWarning\
        \ Unhealthy 3s (x2 over 8s) kubelet Liveness probe failed: **\"probe failed due to timeout \"**\nWarning Unhealthy\
        \ 3s (x2 over 8s) kubelet Readiness probe failed: **\"probe failed due to timeout \"**\n\n![image](https://user-images.githubusercontent.com/67972762/140036570-b2ebdaca-9420-40e4-a5f1-df3dfa7f9b3b.png)\n\
        \n### What did you expect to happen?\n\nIt would be better if actual reason or something for probe failure printed\
        \ in pod describe events incase of liveness/readiness probe gets timeout.\n\nExample like below in pod describe events:\n\
        -----------------------------------\nWarning Unhealthy 3s (x2 over 8s) kubelet Liveness probe failed: **\"probe failed\
        \ due to timeout \"**\nWarning Unhealthy 3s (x2 over 8s) kubelet Readiness probe failed: **\"probe failed due to timeout\
        \ \"**\n\n### How can we reproduce it (as minimally and precisely as possible)?\n\nBelow is the example manifest file\
        \ to reproduce the issue. \n===================\napiVersion: v1\nkind: Pod\nmetadata:\n  labels:\n    test: liveness\n\
        \  name: liveness-exec\nspec:\n  containers:\n  - name: liveness\n    image: k8s.gcr.io/busybox\n    args:\n    -\
        \ /bin/sh\n    - -c\n    - touch /tmp/healthy; sleep 30; rm -rf /tmp/healthy; sleep 600\n       readinessProbe:\n\
        \      exec:\n        command:  [/bin/sh, -c , 'sleep 10 && exit10']\n      initialDelaySeconds: 5\n      periodSeconds:\
        \ 5\n      timeoutSeconds: 2\n    livenessProbe:\n      exec:\n        command:  [/bin/sh, -c ,'sleep 5 && exit10']\n\
        \      initialDelaySeconds: 5\n      periodSeconds: 5\n      timeoutSeconds: 2 \n\nCreate a pod using above manifest\
        \ file and do pod describe (kubectl describe pod <pod-name >) and check for the events. \n![image](https://user-images.githubusercontent.com/67972762/140037360-a4c355da-b4da-4a71-a53b-e1b2467965d3.png)\n\
        \n### Anything else we need to know?\n\n_No response_\n\n### Kubernetes version\n\nkubectl version\nClient Version:\
        \ version.Info{Major:\"1\", Minor:\"21\", GitVersion:\"v1.21.1\", GitCommit:\"841a4f4f3d4528aa284171074e00503faea18496\"\
        , GitTreeState:\"clean\", BuildDate:\"2021-08-31T06:59:53Z\", GoVersion:\"go1.16.4\", Compiler:\"gc\", Platform:\"\
        linux/amd64\"}\nServer Version: version.Info{Major:\"1\", Minor:\"21\", GitVersion:\"v1.21.1\", GitCommit:\"841a4f4f3d4528aa284171074e00503faea18496\"\
        , GitTreeState:\"clean\", BuildDate:\"2021-08-31T06:52:44Z\", GoVersion:\"go1.16.4\", Compiler:\"gc\", Platform:\"\
        linux/amd64\"}\n\n### Cloud provider\n\nopenstack\n\n### OS version\n\n<details>\n\n```console\n# On Linux:\n$ cat\
        \ /etc/os-release\n# paste output here\n$ uname -a\n# paste output here\n\n# On Windows:\nC:\\> wmic os get Caption,\
        \ Version, BuildNumber, OSArchitecture\n# paste output here\n```\n\n</details>\n\n### Install tools\n\n<details>\n\
        \n</details>\n\n### Container runtime (CRI) and and version (if applicable)\n\ncontainerd\n\n### Related plugins (CNI,\
        \ CSI, ...) and versions (if applicable)\n\n_No response_"
      author_association: NONE
      created_at: '2021-11-03T09:42:35Z'
