  inputs:
    issue:
      number: 124279
      title: rename mergo module
      body: |-
        ### What would you like to be added?

        Module `github.com/imdario/mergo` has been renamed as `dario.cat/mergo` and should be updated in `kubernetes/client-go/clientcmd`.

        ### Why is this needed?

        It's causing warnings when we run `go mod tidy` in repos that call `client-go/clientcmd`.
