- name: kubernetes-132966
  inputs:
    issue:
      number: 132966
      title: Following Docs for Configuring Kubelet for UserNamespace support in 1.33.2 Fails with "id 62698912 is out of
        range" crashing Kubelet
      body: "### What happened?\n\nFollowing [Setup a Node for User Namespaces](https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/#set-up-a-node-to-support-user-namespaces)\
        \ in the documentation, and taking the suggested config for `subuid` and `subgid` verbatim to test that it works (`kubelet:65536:7208960`)\
        \ passes Kubelet's check for subuid/gid configuration, however it then fails to start due to the following error:\n\
        \n```\n\"command failed\" err=\"failed to run Kubelet: failed to create kubelet: create user namespace manager: record\
        \ pod mappings: id 626982912 is out of range\"\n```\n\nThis prevents any container from being scheduled, regardless\
        \ of settings in the container or pod, as kubelet fails to start. I've been unable to find this error referenced anywhere\
        \ and am uncertain of what the documentation has wrong here.\n\nCommenting the configuration out in subuid/subgid\
        \ allows the kubelet to start, but then pods with `hostUsers: false` behave as though they do not have enough UIDs\
        \ and fail. \n\n### What did you expect to happen?\n\nSuggested configuration in docs should work. \n\nThere should\
        \ also be documentation somewhere covering the `\"command failed\" err=\"failed to run Kubelet: failed to create kubelet:\
        \ create user namespace manager: record pod mappings: id 626982912 is out of range\"` error and what to do about it.\n\
        \n### How can we reproduce it (as minimally and precisely as possible)?\n\n* Install Debian 12\n* Install Kernel 6.12.*\
        \ from backports to bring in supported features needed for this added in kernel 6.3\n* Install crio, kubeadm, kubelet\
        \ and kubectl version 1.33.2 as per the kubeadm cluster creation docs\n* Install `uidmap` package via apt\n* Configure\
        \ kubelet user for submapping: `sudo adduser --system --no-create-home --disabled-login --group kubelet kubelet`\n\
        * Add following line to both `/etc/subgid` and `/etc/subuid` as per documentation: `kubelet:65536:7208960`\n* Restart\
        \ kubelet or restart node\n\nkubelet will crash after this.\n\n### Anything else we need to know?\n\n_No response_\n\
        \n### Kubernetes version\n\n<details>\n\n```console\nrouthinator@red-leader01:~$ kubectl version\nClient Version:\
        \ v1.33.2\nKustomize Version: v5.6.0\nServer Version: v1.33.2\n\n```\n\n</details>\n\n### Cloud provider\n\nNA - baremetal\
        \ kubeadm cluster\n\n### OS version\n\n<details>\n\n```console\nrouthinator@green02:~$ cat /etc/os-release\nPRETTY_NAME=\"\
        Debian GNU/Linux 12 (bookworm)\"\nNAME=\"Debian GNU/Linux\"\nVERSION_ID=\"12\"\nVERSION=\"12 (bookworm)\"\nVERSION_CODENAME=bookworm\n\
        ID=debian\nHOME_URL=\"https://www.debian.org/\"\nSUPPORT_URL=\"https://www.debian.org/support\"\nBUG_REPORT_URL=\"\
        https://bugs.debian.org/\"\nrouthinator@green02:~$ uname -a\nLinux green02 6.12.32+bpo-amd64 #1 SMP PREEMPT_DYNAMIC\
        \ Debian 6.12.32-1~bpo12+1 (2025-06-21) x86_64 GNU/Linux\n\n```\n\n</details>\n\n### Install tools\n\n<details>\n\
        kubeadm\n</details>\n\n### Container runtime (CRI) and version (if applicable)\n\n<details>\ncri-o, v1.33.2\n\n```shell\n\
        routhinator@green02:~$ sudo crictl version\nVersion:  0.1.0\nRuntimeName:  cri-o\nRuntimeVersion:  1.33.2\nRuntimeApiVersion:\
        \  v1\n\n```\n</details>\n\n### Related plugins (CNI, CSI, ...) and versions (if applicable)\n\n<details>\nCNI: Cilium\
        \ in eBPF mode\nCSI: democratic-csi with Truenas Scale\n</details>"
      author_association: NONE
      created_at: '2025-07-15T18:52:35Z'
