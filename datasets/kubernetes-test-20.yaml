- name: kubernetes-123971
  inputs:
    issue:
      number: 123971
      title: pod with initcontainer failed with UnexpectedAdmissionError when restart kubelet
      body: "### What happened?\n\nMemory manager have bug, restart kubelet (do not delete any checkpoint file ), pod with\
        \ init-container will failed.\n\n### What did you expect to happen?\n\nPod A and Pod B is still running.\n\n### How\
        \ can we reproduce it (as minimally and precisely as possible)?\n\nI have a node had 256Gi and 2 NUMA node with 128Gi\
        \ for one NUMA;\n1. Create Pod A, with init-container and container both 100Gi\n2. Create Pod B, with init-container\
        \ and container both 100Gi \n3. Restart kubelet.\n4. Both Pod A and Pod B failed with UnexpectedAdmissionError\n\n\
        ### Anything else we need to know?\n\nIn `--topology-policy=single-numa-node` mode.\nWhen memory manager caculate\
        \ memory for topology, it will caculate init-container firstly, when comes to app container, it will reuse the init-container's\
        \ memory as possible,  and reduce init-container's memory in state, it's as expected;\n\nhttps://github.com/kubernetes/kubernetes/blob/9df98f3d393e204dd8db02322057ac2e7f3f6c28/pkg/kubelet/cm/memorymanager/policy_static.go#L192\n\
        https://github.com/kubernetes/kubernetes/blob/9df98f3d393e204dd8db02322057ac2e7f3f6c28/pkg/kubelet/cm/memorymanager/policy_static.go#L956-L965\n\
        \nBut when restart kubelet, memory manager will re calculate memory for init-container,  if now node has not enough\
        \ memory for init-container, the whole pod will be failed because of Admit failed;\n\n<img width=\"1060\" alt=\"image\"\
        \ src=\"https://github.com/kubernetes/kubernetes/assets/151703335/d455fd2e-b7a6-4661-825a-ae661d96d84a\">\n\nAfter\
        \ restart kubelet:\n<img width=\"1420\" alt=\"image\" src=\"https://github.com/kubernetes/kubernetes/assets/151703335/cd1f196d-b3c7-418f-b670-90bb51051321\"\
        >\n\n### Kubernetes version\n\n<details>\n\n```console\n$ kubectl version\nClient Version: version.Info{Major:\"1\"\
        , Minor:\"22\", GitVersion:\"v1.22.17\", GitCommit:\"a7736eaf34d823d7652415337ac0ad06db9167fc\", GitTreeState:\"clean\"\
        , BuildDate:\"2022-12-08T11:47:36Z\", GoVersion:\"go1.16.15\", Compiler:\"gc\", Platform:\"linux/amd64\"}\nServer\
        \ Version: version.Info{Major:\"1\", Minor:\"22\", GitVersion:\"v1.22.17\", GitCommit:\"a7736eaf34d823d7652415337ac0ad06db9167fc\"\
        , GitTreeState:\"clean\", BuildDate:\"2022-12-08T11:42:04Z\", GoVersion:\"go1.16.15\", Compiler:\"gc\", Platform:\"\
        linux/amd64\"}\n```\n\n</details>\n\n### Cloud provider\n\n<details>\n\n</details>\n\n### OS version\n\n<details>\n\
        \n```console\n# On Linux:\n$ cat /etc/os-release\n# paste output here\n$ uname -a\n# paste output here\n\n# On Windows:\n\
        C:\\> wmic os get Caption, Version, BuildNumber, OSArchitecture\n# paste output here\n```\n\n</details>\n\n### Install\
