      number: 126542
      title: Static Pods never get evicted when under Node Pressure
      body: "### What happened?\n\nStatic Pods are considered critical by [this code] (https://github.com/kubernetes/kubernetes/blob/master/pkg/kubelet/eviction/eviction_manager.go#L597)\
        \ and hence never get evicted.\n\n### What did you expect to happen?\n\nThe [doc](https://github.com/kubernetes/kubernetes/blob/master/pkg/kubelet/eviction/eviction_manager.go#L597)\
        \ says \n\n> If you are running a [static pod](https://kubernetes.io/docs/concepts/workloads/pods/#static-pods) and\
        \ want to avoid having it evicted under resource pressure, set the priority field for that Pod directly. Static pods\
        \ do not support the priorityClassName field.\n\nAt least, we should fix the inconsistency between code and doc.\n\
        \n### How can we reproduce it (as minimally and precisely as possible)?\n\n1. Run a kubelet with fs eviction and static\
        \ pods\n```\napiVersion: kubelet.config.k8s.io/v1beta1\nstaticPodPath: /home/k8s/manifests\nevictionHard:\n  imagefs.available:\
        \ \"2Gi\"\n```\n\n2. Create a static pod spamming disk\n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: disk\n\
        spec:\n  priority: 0\n  - name: disk\n    image: docker.io/busybox\n    command: [\"/bin/sh\",  \"-c\", \"/bin/dd\
        \ if=/dev/zero of=/bigfile bs=1G count=102 && sleep 10000\"]\n```\n\n3. check kubelet logs\n> \"Eviction manager:\
        \ cannot evict a critical pod\" pod=\"default/disk\"\n\n### Anything else we need to know?\n\n_No response_\n\n###\
        \ Kubernetes version\n\n<details>\n\n```console\n$ kubectl version\n# paste output here\n```\n\n</details>\n\n###\
        \ Cloud provider\n\n<details>\nGCP\n</details>\n\n### OS version\n\n<details>\n\n```console\n# On Linux:\n$ cat /etc/os-release\n\
        # paste output here\n$ uname -a\n# paste output here\n\n# On Windows:\nC:\\> wmic os get Caption, Version, BuildNumber,\
        \ OSArchitecture\n# paste output here\n```\n\n</details>\n\n### Install tools\n\n<details>\n\n</details>\n\n### Container\
        \ runtime (CRI) and version (if applicable)\n\n<details>\n\n</details>\n\n### Related plugins (CNI, CSI, ...) and\
        \ versions (if applicable)\n\n<details>\n\n</details>"
      author_association: CONTRIBUTOR
      created_at: '2024-08-05T10:10:34Z'
