- name: kubernetes-111476
  inputs:
    issue:
      number: 111476
      title: API server etcd3 client logger uses significant amounts of memory when many CRDs are installed
      body: "### What happened?\n\n### Context\n\nThe @crossplane project uses a lot of CRDs - in some cases almost 2,000.\
        \ I do mean `kind: CustomResourceDefinition` here, not custom resources. We've noticed that API server memory consumption\
        \ balloons when many CRDs are installed - for example with ~1,900 CRDs we see the API server using up to ~8Gi RSS.\n\
        \nA little profiling shows that around 1.5Gi of that memory is being used by the etcd3 client's logger.\n\n### With\
        \ the Logger\n\nWith Kubernetes built from e092b6d27bff00 with the CRDs at https://github.com/negz/crossplane-scale/tree/dc25bef/etoomanycrds/latest-crds\
        \ loaded I'm seeing the API server using up to ~7.5GiB RSS. I see it dip to ~5.5GiB, presumably when garbage collection\
        \ runs.\n\n```\n$ k get nodes\nNAME                                   STATUS   ROLES           AGE     VERSION\ne092b6d27bf-withlogger-control-plane\
        \   Ready    control-plane   9m47s   v1.25.0-alpha.3.190+e092b6d27bff00\n\n$ k get crds|wc -l\n1878\n```\n\nYou can\
        \ see `zapCore.newCounters` taking up a ton of memory below. Zap is the logger used by the etcd client. Note that\
        \ this is a sample, so it's actually using more than the indicated ~800MiB. \n\n![profile-with-logger](https://user-images.githubusercontent.com/1049349/181346601-79dcc113-8a32-4cc9-aed3-8527d9a7b460.png)\n\
        \n### Without the Logger\n\nI'm seeing the API server using up to ~6GiB RSS. I see it dip to ~4.5GiB, presumably due\
        \ to GC runs.\n\n```\n$ k get nodes\nNAME                                      STATUS   ROLES           AGE   VERSION\n\
        e092b6d27bf-withoutlogger-control-plane   Ready    control-plane   31m   v1.25.0-alpha.3.190+e092b6d27bff00-dirty\n\
        \n$ k get crds|wc -l\n1878\n```\n\nYou can see `zapCore.newCounters` no longer appears below.\n\n![profile-without-logger](https://user-images.githubusercontent.com/1049349/181350279-9c23527d-ff98-4f1d-bf43-db60e4cae27f.png)\n\
        \n### What did you expect to happen?\n\nI would not expect a logger to be responsible for such a significant amount\
        \ of the API server's memory consumption.\n\n### How can we reproduce it (as minimally and precisely as possible)?\n\
        \nYou can get the above profile by:\n\n1. Checking out e092b6d27bff00.\n2. `kind build node-image .` to build a kind\
        \ node.\n3. `kind create cluster --image kindest/node:latest` to start a control plane for the above build.\n5. `kubectl\
        \ apply -f https://raw.githubusercontent.com/negz/crossplane-scale/dc25bef/profile.yaml` to allow anonymous pprof\
        \ access\n6. `kubectl apply -f` the CRDs from https://github.com/negz/crossplane-scale/tree/dc25bef/etoomanycrds/latest-crds\n\
        7. `go tool pprof -png https+insecure://localhost:$(kind get kubeconfig|grep server|cut -d: -f4)/debug/pprof/heap`\n\
        \nI used https://github.com/nicolargo/glances to see the RSS but I imagine `top` would show it too.\n\n### Anything\
        \ else we need to know?\n\n_No response_\n\n### Kubernetes version\n\n<details>\n\n```console\nv1.25.0-alpha.3.190+e092b6d27bff00\n\
        ```\n\n</details>\n\n### Cloud provider\n\n<details>\nN/A\n</details>\n\n### OS version\n\n<details>\n\n```console\n\
        # On Linux:\n$ cat /etc/os-release\nBUG_REPORT_URL=\"https://github.com/NixOS/nixpkgs/issues\"\nBUILD_ID=\"22.05.20220713.365e1b3\"\
        \nDOCUMENTATION_URL=\"https://nixos.org/learn.html\"\nHOME_URL=\"https://nixos.org/\"\nID=nixos\nLOGO=\"nix-snowflake\"\
        \nNAME=NixOS\nPRETTY_NAME=\"NixOS 22.05 (Quokka)\"\nSUPPORT_URL=\"https://nixos.org/community.html\"\nVERSION=\"22.05\
        \ (Quokka)\"\nVERSION_CODENAME=quokka\nVERSION_ID=\"22.05\"\n\n$ uname -a\nLinux mael 5.18.7 #1-NixOS SMP Sat Jun\
        \ 25 13:29:48 UTC 2022 aarch64 GNU/Linux\n```\n\n</details>\n\n### Install tools\n\n<details>\n`kind`\n</details>\n\
        \n### Container runtime (CRI) and version (if applicable)\n\n<details>\n\n</details>\n\n### Related plugins (CNI,\
        \ CSI, ...) and versions (if applicable)\n\n<details>\n\n</details>"
      author_association: CONTRIBUTOR
      created_at: '2022-07-27T21:42:33Z'
    repo:
      name: kubernetes/kubernetes
      labels: *repo_labels
      latest_release: v1.24.3
      as_of: '2022-07-27T21:42:33Z'
  metadata:
