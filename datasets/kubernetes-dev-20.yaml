          ----     ------       ----                    ----     -------
          Warning  FailedMount  25m (x32 over 6h16m)    kubelet  Unable to attach or mount volumes: unmounted volumes=[loki], unattached volumes=[config loki kubeconfig telegraf-config-volume]: timed out waiting for the condition
          Warning  FailedMount  9m19s (x35 over 6h9m)   kubelet  Unable to attach or mount volumes: unmounted volumes=[loki], unattached volumes=[loki kubeconfig telegraf-config-volume config]: timed out waiting for the condition
          Warning  FailedMount  4m47s (x26 over 5h54m)  kubelet  Unable to attach or mount volumes: unmounted volumes=[loki], unattached volumes=[telegraf-config-volume config loki kubeconfig]: timed out waiting for the condition
          Warning  FailedMount  16s (x75 over 6h21m)    kubelet  Unable to attach or mount volumes: unmounted volumes=[loki], unattached volumes=[kubeconfig telegraf-config-volume config loki]: timed out waiting for the condition
        ```

        Note that the generated events are shown in 4 section. The only difference between the messages is how the `unattached volumes` are sorted. I suggest to sort the unmounted/unattached) volumes for the event message. This will allow to group all events and properly have the age and the occurrences count reported.

        ### What did you expect to happen?

        I would expect the unmounted/unattached) volumes to be sorted in the events' message and to do not have several group of events for the same issue.

