    early_maintainer_comments:
    - "/cc @MikeSpreitzer @tkashem \n/triage accepted\n"
    - |-
      We have been in the business of watermarking since before I got involved.  The max-in-flight filter was already doing watermarking.

      The simplest thing to do is to use a gauge.  Consider a scenario where scrapes happen once per minute (and yes, I know some real scenarios like that).  In that case the admin can only see situations that are very stable.
    - |-
      What do you mean by "current"?  When would `Observe` be called for such a histogram?  If that happens when the variable of primary interest changes then we are not getting time-weighted data.  Consider two scenarios.  In scenario A, the variable jumps up at time T0 and back down at time T0+1ms.  In scenario B, the variable jumps up at time T0 and back down at time T0+10s.  Those both produce the same metrics if we only Observe when the variable changes.

      If we want a time-weighted sampling, well, that is the source of most of the complexity you cited.  Note that the cited code is producing both a histogram of _periodic_ samples and a histogram of watermarks.

      The histogram of watermarks lets us know what the sampling missed.
