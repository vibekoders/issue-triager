        \ is '(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?').\n  Warning  FailedScheduling   4m44s  default-scheduler   0/40\
        \ nodes are available: 40 parsing pod: requiredAffinityTerms: invalid label value: \"-api-gateway-mockservice\": at\
        \ key: \"release\": a valid label must be an empty string or consist of alphanumeric characters, '-', '_' or '.',\
        \ and must start and end with an alphanumeric character (e.g. 'MyValue',  or 'my_value',  or '12345', regex used for\
        \ validation is '(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?').\n  Warning  FailedScheduling   110s   default-scheduler\
        \   0/40 nodes are available: 40 parsing pod: requiredAffinityTerms: invalid label value: \"-api-gateway-mockservice\"\
        : at key: \"release\": a valid label must be an empty string or consist of alphanumeric characters, '-', '_' or '.',\
        \ and must start and end with an alphanumeric character (e.g. 'MyValue',  or 'my_value',  or '12345', regex used for\
        \ validation is '(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?').\n  Warning  FailedScheduling   51s    default-scheduler\
        \   0/40 nodes are available: 40 parsing pod: requiredAffinityTerms: invalid label value: \"-api-gateway-mockservice\"\
        : at key: \"release\": a valid label must be an empty string or consist of alphanumeric characters, '-', '_' or '.',\
        \ and must start and end with an alphanumeric character (e.g. 'MyValue',  or 'my_value',  or '12345', regex used for\
        \ validation is '(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?').\n  Normal   NotTriggerScaleUp  4m40s  cluster-autoscaler\
        \  pod didn't trigger scale-up: 51 parsing pod: requiredAffinityTerms: invalid label value: \"-api-gateway-mockservice\"\
        : at key: \"release\": a valid label must be an empty string or consist of alphanumeric characters, '-', '_' or '.',\
        \ and must start and end with an alphanumeric character (e.g. 'MyValue',  or 'my_value',  or '12345', regex used for\
        \ validation is '(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?')\n ```\n\n### What did you expect to happen?\n\nkube-scheduler\
        \ should not panic.\n\n### How can we reproduce it (as minimally and precisely as possible)?\n\nSubmit a deployment\
