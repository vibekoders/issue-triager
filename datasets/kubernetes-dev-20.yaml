      title: kube-scheduler panics on malformed label
      body: "### What happened?\n\nA deployment was inadvertently created with a malformed label in `requiredAffinityTerms`\
        \ which appears to have caused the kube-scheduler to panic and crash.\n\nError from kube-scheduler pods: \n```\nE0107\
        \ 05:56:44.099432       1 scheduling_queue.go:547] Error getting label selectors for pod: REDACTED.\nE0107 05:56:44.099573\
        \       1 runtime.go:78] Observed a panic: \"invalid memory address or nil pointer dereference\" (runtime error: invalid\
        \ memory address or nil pointer dereference)\ngoroutine 353 [running]:\nk8s.io/kubernetes/vendor/k8s.io/apimachinery/pkg/util/runtime.logPanic(0x1b0f760,\
        \ 0x2d9c290)\n            /workspace/src/k8s.io/kubernetes/_output/dockerized/go/src/k8s.io/kubernetes/vendor/k8s.io/apimachinery/pkg/util/runtime/runtime.go:74\
        \ +0x95\nk8s.io/kubernetes/vendor/k8s.io/apimachinery/pkg/util/runtime.HandleCrash(0x0, 0x0, 0x0)\n            /workspace/src/k8s.io/kubernetes/_output/dockerized/go/src/k8s.io/kubernetes/vendor/k8s.io/apimachinery/pkg/util/runtime/runtime.go:48\
        \ +0x89\npanic(0x1b0f760, 0x2d9c290)\n            /usr/local/go/src/runtime/panic.go:969 +0x1b9\n```\n\nEvents from\
        \ REDACTED pod:\n```\nEvents:\n  Type     Reason             Age    From                Message\n  ----     ------\
        \             ----   ----                -------\n  Warning  FailedScheduling   4m44s  default-scheduler   0/40 nodes\
