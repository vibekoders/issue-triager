    - "Thanks for raising this! \n\nFor cost evaluation, we have both estimated cost and runtime cost. I believe in most cases\
      \ the runtime cost is actually smaller than the limit we have set, but when it comes to estimated cost, since we would\
      \ like to prevent the expensive validation rules from running as early as possible which aligned with the shift-left\
      \ effort, the unbounded list size without a `maxtItems` specified would be quite large especially after multiple selection\
      \ operation. We have specifically called out the best practice to `put a limit via maxItems, maxProperties, and maxLength\
      \ for anything that will be processed in a validation rule in order to prevent validation errors during cost estimation`\
      \ here: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/#resource-use-by-validation-functions\
      \ to encourage users to follow the best practice.\n\nFor the use case of replacing `OneOf`, have you considered to use\
      \ cel macro like `exists_one`(Ref: https://github.com/google/cel-go#macros)? I believe it might help greatly in this\
      \ case. Thank you!"
    - "\n> The CEL expression doesn't matter here, I can put `'true'` and it is still over the cost limit (IIRC - I tried\
      \ yesterday).\n\nCurious how come it exceeds the limit with only `true` in the expression. The expression itself is\
      \ evaluated against the estimated cost and the `really small number` you mentioned above is the estimated cost CEL provides\
      \ for operations used in validation expressions you provided. \n\n> I get the best practices, but this is not greenfield.\
      \ We are one of the largest established projects using CRDs, there are literally millions of instances of our CRs deployed.\
      \ Making breaking changes to our APIs is effectively impossible, especially when the reason is to meet (some what arbitrary)\
      \ CRD limitations.\n>\nThe feature currently stays in beta and bug fix in cel side did cause some backward incompatible\
      \ issue(https://github.com/kubernetes/kubernetes/issues/120821). We would try to prevent breaking changes from happening\
      \ and one of the effort is  [CRD Validation Ratcheting](https://github.com/kubernetes/enhancements/issues/4008). It\
      \ will greatly help in this case if `Ensure updates to a CRD that don't change CEL rules are allowed even if the existing\
      \ CEL rules exceed cost estimates` and we'll be working on it. \n\n> For some of our CRDs, we had to limit he maxItems\
      \ to 100 to meet the overall execution limits -- and this is just to add _one_ CEL expresion; we plan (or planned) to\
      \ add 100s. We have real users in production with well over 100 items\n\nIf in production users have a really large\
      \ items and try to do some expensive cel call, it will not pass since we have multiple limitation in place like per\
      \ expression cost limit, overall expression limit, etc. Unfortunately we don't have unlimited resource to provide, at\
      \ least it's better than blow up cluster :)\n\n"
