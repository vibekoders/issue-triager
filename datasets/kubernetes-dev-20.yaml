    early_maintainer_comments:
    - "/assign @apelisse \n/triage accepted"
    - /cc
    - |
      The `managedField` is not updated because you are not changing the structure of the object (adding or removing fields).
      According to [managedfieldsupdater](https://github.com/kubernetes/kubernetes/blob/master/staging/src/k8s.io/apiserver/pkg/endpoints/handlers/fieldmanager/managedfieldsupdater.go#L65), the time is updated if and only if the fieldSet is changed. It does not take into account the value of fields.

      One option would be to not compare the fieldSets but directly compare the liveObject & newObject for differences and update the `time` field accordingly.
      Is it the desired behavior to update the time of `managedFields` when only the value is updated?
    - '@apelisse, is that documentation correct? Is this what we intended?'
    - |-
      > Yes! Look at the first paragraph of https://kubernetes.io/docs/reference/using-api/server-side-apply/#apply-and-update

      I don't see any mention to the timestamp in that first paragraph.

      We've clarified recently the exact semantic of the timestamp, as defined here:
      https://github.com/kubernetes/kubernetes/blob/master/staging/src/k8s.io/apimachinery/pkg/apis/meta/v1/types.go#L1229-L1233

      I think you've identified the wrong code @glebiller, if you want to go ahead and fix it, go ahead, I'll happily review!
