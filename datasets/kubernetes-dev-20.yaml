- name: kubernetes-106302
  inputs:
    issue:
      number: 106302
      title: Reconsider how we implement watermarks in P&F
      body: |-
        Spin off from https://github.com/kubernetes/kubernetes/pull/105873/files#r735360613

        In my opinion, having additional concepts of TimedObservers rather than relying directly on metrics is unnecessarily complicating the (already pretty complicated) codebase.
        My main questions are:
        - do we really need them?
        - do we really want to get into the business of watermarks, etc.? Can't we rely on monitoring solutions to just do that (compute the max?)

        Mike`s argument was that scraping latency of metric is an issue, but my question is whether it is really an issue?

        For example - if my PL was saturated for 1ms, and other than that stays 50% occupied only - is that really something I care as an operator? I can't imagine any action I could take as an operator based on that information.

        I would really like to see that simplified, but also that's not something I want to block the above PR on - so opening this issue to discuss that further.

        @tkashem @MikeSpreitzer
      author_association: MEMBER
      created_at: '2021-11-10T09:04:23Z'
    repo:
      name: kubernetes/kubernetes
      labels: *repo_labels
      latest_release: v1.22.3
      as_of: '2021-11-10T09:04:23Z'
  metadata:
    created_at: '2021-11-10T09:04:23Z'
    state: CLOSED
    state_reason: COMPLETED
    closed_at: '2021-11-15T19:02:20Z'
    closed_by: wojtek-t
    closed_by_bot: false
    stale: false
